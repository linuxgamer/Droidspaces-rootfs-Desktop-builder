name: Publish all-desktop Wayland RootFS

on:
  workflow_dispatch:
    inputs:
      sync_cnb:
        description: Sync Chinese assets to CNB after build
        required: false
        default: false
        type: boolean
      sync_cnb_only:
        description: Skip the build and only sync an existing GitHub Release to CNB
        required: false
        default: false
        type: boolean
      release_tag:
        description: GitHub Release tag used only in sync-only mode
        required: true
        default: droidspaces-rootfs-all-wayland
        type: string
      upload_concurrency:
        description: CNB concurrent uploads
        required: true
        default: 9999
        type: number
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: droidspaces-rootfs-all-wayland
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: droidspaces-rootfs-all-wayland
  WAYLAND_PACKAGE_REPOSITORY: Goldzxcbug/droidspaces-package

jobs:
  prepare:
    name: Prepare unified version
    if: ${{ inputs.sync_cnb_only != true }}
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - id: meta
        run: |
          build_epoch="$(date -u +'%s')"
          build_id="v$(date -u -d "@$build_epoch" +'%Y%m%d-%H%M%S')"
          build_time="$(date -u -d "@$build_epoch" +'%Y-%m-%d %H:%M:%S UTC')"
          printf 'build_id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

  build-zh:
    name: Build Chinese RootFS
    if: ${{ inputs.sync_cnb_only != true }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: all-wayland
      custom_username: Gold
      desktop: all-wayland
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: true
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: true
      enable_systemd257: false
      enable_srf: true
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: false
      enable_docker: false
      enable_chrome: false
      enable_usb_manager: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: zh
      publish_release: false

  build-en:
    name: Build English RootFS
    if: ${{ inputs.sync_cnb_only != true }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: all-wayland
      custom_username: Gold
      desktop: all-wayland
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: false
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: false
      enable_systemd257: false
      enable_srf: false
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: false
      enable_docker: false
      enable_chrome: false
      enable_usb_manager: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: en
      publish_release: false

  release:
    name: Update GitHub rolling release
    needs: [prepare, build-zh, build-en]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-rootfs'
          merge-multiple: true
          path: release-assets

      - name: Generate bilingual index
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail
          bash scripts/generate-rootfs-manifests.sh \
            --assets release-assets \
            --language zh \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --output release-assets/rootfs_zh.json
          bash scripts/generate-rootfs-manifests.sh \
            --assets release-assets \
            --language en \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --output release-assets/rootfs_en.json
          jq -s 'add | sort_by(.language, .distro, .name, .architecture)' \
            release-assets/rootfs_zh.json release-assets/rootfs_en.json \
            > release-assets/rootfs.json

          notes_file="$RUNNER_TEMP/rootfs-release-notes.md"
          cat > "$notes_file" <<'EOF'
          ## English

          Rolling ARM64 RootFS collection for Droidspaces, covering 40 distribution and desktop combinations:
          - Distributions: Debian 13, Ubuntu 26.04, Fedora 43, Fedora 44, and Arch Linux.
          - Anland Wayland desktops: KDE Plasma, KDE Plasma Mobile, GNOME, Anland Next, Niri, Hyprland, Mango, and Denial.

          Each combination is available in Chinese and English, for 80 `.tar.xz` archives in total. Use `rootfs_en.json` or `rootfs_zh.json` as the subscription manifest in Droidspaces RootFS management. The manifests include version, file size, SHA-256 checksum, and download URL for each image.

          The images are built for ARM64 and include Droidspaces desktop auto-start and Qualcomm Adreno/Mesa support. This rolling release is refreshed by the scheduled weekly build.

          ## Chinese

          Rolling ARM64 RootFS collection for Droidspaces, covering 40 distribution and desktop combinations:
          - Distributions: Debian 13, Ubuntu 26.04, Fedora 43, Fedora 44, and Arch Linux.
          - Anland Wayland desktops: KDE Plasma, KDE Plasma Mobile, GNOME, Anland Next, Niri, Hyprland, Mango, and Denial.

          Each combination is available in Chinese and English, for 80 `.tar.xz` archives in total. Use `rootfs_zh.json` or `rootfs_en.json` as the subscription manifest in Droidspaces RootFS management. The manifests include version, file size, SHA-256 checksum, and download URL for each image.

          The images are built for ARM64 and include Droidspaces desktop autostart configuration and Qualcomm Adreno/Mesa support. This rolling release is refreshed by the weekly scheduled build.
          EOF
          {
            printf '\n## Build information\n\n'
            printf '%s\n' \
              "- Build ID: $BUILD_ID" \
              "- Build time (UTC): $BUILD_TIME" \
              "- Release tag: $RELEASE_TAG" \
              '- Architecture: ARM64' \
              '- Archives: 80 (40 Chinese + 40 English)'
            printf '\n## Direct download index\n\n'
            printf '%s\n' \
              "- [Complete index: rootfs.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs.json) — all 80 Chinese and English RootFS download addresses." \
              "- [English subscription index: rootfs_en.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs_en.json)" \
              "- [Chinese subscription index: rootfs_zh.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs_zh.json)"
          } >> "$notes_file"
          echo "ROOTFS_RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Create or update the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="$(cat "$ROOTFS_RELEASE_NOTES_FILE")"
          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            echo "Updating existing rolling tag: $RELEASE_TAG"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            echo "Creating rolling tag: $RELEASE_TAG"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

          release_list="$RUNNER_TEMP/rootfs-releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_list"
          if ! jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' "$release_list" >/dev/null; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Droidspaces all-desktop Wayland RootFS" \
              --notes "$release_notes" \
              --draft \
              --latest=false
          fi

      - name: Upload RootFS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f -name '*.tar.xz' -print | sort)
          [ "${#archives[@]}" -eq 80 ]
          gh release upload "$RELEASE_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" \
            release-assets/rootfs.json \
            release-assets/rootfs_zh.json release-assets/rootfs_en.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Delete old assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="$(cat "$ROOTFS_RELEASE_NOTES_FILE")"
          expected="$RUNNER_TEMP/rootfs-expected-assets.txt"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
          release_json="$RUNNER_TEMP/rootfs-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -ce \
            --arg tag "$RELEASE_TAG" '
              [.[] | select(.tag_name == $tag)]
              | if length == 1 then .[0] else error("rolling release is not unique") end
            ' > "$release_json"
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fqx -- "$asset_name" "$expected"; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$release_json")
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droidspaces all-desktop Wayland RootFS" \
            --notes "$release_notes" \
            --draft=false --prerelease=false --latest=false

  sync-cnb:
    name: Sync Chinese assets to CNB
    if: ${{ inputs.sync_cnb == true && inputs.sync_cnb_only != true }}
    needs: [prepare, build-zh, build-en]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Chinese RootFS build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-zh-rootfs'
          merge-multiple: true
          path: cnb-assets

      - name: Generate CNB Chinese index
        env:
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: |
          set -euo pipefail
          bash scripts/generate-rootfs-manifests.sh \
            --assets cnb-assets \
            --language zh \
            --release-url "https://cnb.cool/${CNB_REPO}/-/releases/download/${RELEASE_TAG}" \
            --output cnb-assets/rootfs_zh.json
          jq . cnb-assets/rootfs_zh.json > cnb-assets/rootfs.json

      - name: Upload Chinese assets to CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_ROOTFS_LANGUAGE: zh
          CNB_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          CNB_LOCAL_ASSETS_DIR: cnb-assets
        run: bash scripts/publish-cnb-rootfs.sh "$RELEASE_TAG"

  sync-cnb-only:
    name: Sync only the existing release to CNB
    if: ${{ inputs.sync_cnb_only == true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync Chinese assets to CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_ROOTFS_LANGUAGE: zh
          CNB_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
        run: bash scripts/publish-cnb-rootfs.sh "$RELEASE_TAG"
