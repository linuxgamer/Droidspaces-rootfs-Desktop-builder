name: Build and Release Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Distribution to build
        required: true
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-24
          - Ubuntu-26
          - Fedora-44
          - Arch
          - all
          - all-wayland
      custom_username:
        description: Custom username
        required: false
        type: string
        default: Gold
      desktop:
        description: Primary desktop (the one that autostarts)
        required: true
        type: choice
        default: KDE
        options:
          - none
          - KDE
          - KDE mobile
          - GNOME
          - Anland Next
          - Niri
          - Hyprland
          - Mango
          - Denial
      extra_desktops:
        description: "Extra desktops, comma-separated (e.g. Niri,Hyprland)"
        required: false
        type: string
        default: ""
      desktop_autostart:
        description: Start desktop on boot (auto-disabled when desktop is none)
        required: true
        type: boolean
        default: true
      display_backend:
        description: Display backend (Arch KDE and KDE mobile/GNOME/Anland Next/Niri/Hyprland/Mango/Denial always use Anland Wayland)
        required: true
        type: choice
        default: x11
        options:
          - x11
          - anland-wayland
      PulseAudio:
        description: PulseAudio forwarding
        required: true
        type: choice
        default: socket
        options:
          - socket
          - tcp
          - none
      enable_zh_tz:
        description: Use Chinese language and Asia/Shanghai timezone
        required: true
        type: boolean
        default: false
      enable_mesa:
        description: Enable Qualcomm Snapdragon GPU support
        required: true
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: Fix Snapdragon 8 Gen 2 Wayland corruption
        required: true
        type: boolean
        default: false
      nosnap:
        description: Remove Ubuntu Snap
        required: true
        type: boolean
        default: false
      enable_systemd257:
        description: Use the systemd 257 package family (none and standard KDE only)
        required: true
        type: boolean
        default: false
      enable_srf:
        description: Enable fcitx5
        required: true
        type: boolean
        default: false
      enable_binfmt:
        description: Enable cross-architecture support
        required: true
        type: boolean
        default: false
      enable_yj:
        description: Enable NAT and hardware recognition
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: Install development tools
        required: true
        type: boolean
        default: false
      enable_zip:
        description: Install compression tools
        required: true
        type: boolean
        default: false
      enable_docker:
        description: Install Docker
        required: true
        type: boolean
        default: false
      enable_chrome:
        description: Install Google Chrome (large download)
        required: true
        type: boolean
        default: false
      enable_usb_manager:
        description: Install the USB manager (pulls PyQt5)
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland package repository (public owner/repository)
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package
      mesa_version:
        description: Pin an exact Mesa version (empty = latest from the rolling manifest)
        required: false
        type: string
        default: ''
      anland_package_revision:
        description: Pin the Anland package revision (empty = latest)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: ${{ inputs.build_target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ inputs.desktop }}
      extra_desktops: ${{ inputs.extra_desktops }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.enable_8gen2_wayland }}
      nosnap: ${{ inputs.nosnap }}
      enable_systemd257: ${{ inputs.enable_systemd257 }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      enable_chrome: ${{ inputs.enable_chrome }}
      enable_usb_manager: ${{ inputs.enable_usb_manager }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
      mesa_version: ${{ inputs.mesa_version }}
      anland_package_revision: ${{ inputs.anland_package_revision }}
